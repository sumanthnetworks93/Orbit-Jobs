name: Daily job scrape

on:
  schedule:
    # 6:00 UTC every day
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Orbit job scrape
        env:
          ORBIT_API_URL: ${{ secrets.ORBIT_API_URL }}
        run: |
          if [ -z "$ORBIT_API_URL" ]; then
            echo "Set the ORBIT_API_URL repository secret to your public API, e.g. https://api.example.com"
            exit 1
          fi
          curl -fsS -X POST "${ORBIT_API_URL%/}/api/jobs/sync"
