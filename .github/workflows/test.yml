name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orbit-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: orbit-mobile/package-lock.json
      - run: npm ci
      - run: npm run test:unit

  e2e:
    runs-on: ubuntu-latest
    needs: unit
    defaults:
      run:
        working-directory: orbit-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: orbit-mobile/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start Orbit API
        working-directory: orbit-backend
        run: |
          dotnet run --urls "http://127.0.0.1:5189" > /tmp/orbit-api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:5189/health && exit 0
            sleep 2
          done
          echo "API failed to start" && cat /tmp/orbit-api.log && exit 1
      - run: npm run test:e2e:guest
        env:
          CI: true
          ORBIT_API_URL: http://127.0.0.1:5189
